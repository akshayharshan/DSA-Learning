version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fastapi_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=learning_db
    ports:
      - "5432:5432"  # Maps [Host Port]:[Container Port]
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
